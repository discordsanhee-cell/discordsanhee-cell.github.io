<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스톱워치</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px 0;
        }

        .dev-btn {
            background-color: #ff4d4f;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .dev-btn:hover {
            opacity: 0.85;
        }

        .stopwatch-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        .display {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            font-family: 'Courier New', Courier, monospace;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }

        #startStopBtn {
            background-color: #28a745;
        }

        #startStopBtn.running {
            background-color: #dc3545;
        }

        #resetBtn {
            background-color: #6c757d;
        }

        .music-toggle-btn {
            background-color: #17a2b8;
            font-size: 14px;
            padding: 8px 16px;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        /* 음악 플레이어 영역 */
        .music-section {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            flex-direction: column;
            align-items: center;
        }

        .music-section.active {
            display: flex;
        }

        /* CD 애니메이션 (썸네일 없이 깔끔한 심플 디자인) */
        .cd-player {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #222 0%, #444 50%, #222 100%);
            border: 4px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* CD 홀로그램 무늬 레코드 라인 */
        .cd-player::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* CD 중앙 구멍 */
        .cd-center {
            width: 30px;
            height: 30px;
            background-color: #f0f2f5;
            border-radius: 50%;
            border: 3px solid #bbb;
            z-index: 2;
        }

        /* CD 회전 애니메이션 */
        .cd-player.spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 유튜브 URL 입력 폼 */
        .input-group {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .url-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .url-input:focus {
            border-color: #17a2b8;
        }

        .play-btn {
            background-color: #333;
            padding: 8px 12px;
            font-size: 13px;
        }

        /* Hidden YouTube Iframe */
        #youtube-player-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="stopwatch-container">
        <!-- 트릭 모드 토글 개발자 버튼 -->
        <button class="dev-btn" onclick="toggleTrickMode()">!누를 시 페이지 재설정! 개발자 전용 버튼!</button>

        <div class="display" id="display">00:00:00</div>
        <div class="buttons">
            <button id="startStopBtn" onclick="startStop()">시작</button>
            <button id="resetBtn" onclick="reset()">리셋</button>
        </div>

        <!-- 음악 토글 버튼 -->
        <button class="music-toggle-btn" onclick="toggleMusicSection()">(음악)</button>

        <!-- 음악 재생 섹션 -->
        <div class="music-section" id="musicSection">
            <!-- 썸네일 없는 심플 CD -->
            <div class="cd-player" id="cdPlayer">
                <div class="cd-center"></div>
            </div>

            <div class="input-group">
                <input type="text" id="ytUrlInput" class="url-input" placeholder="유튜브 음악 링크 입력...">
                <button class="play-btn" onclick="loadAndPlayYouTube()">재생</button>
            </div>
        </div>
    </div>

    <!-- 숨겨진 유튜브 플레이어 -->
    <div id="youtube-player-container">
        <div id="player"></div>
    </div>

    <script>
        // 스톱워치 관련 변수
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let isTrickMode = false;

        // 유튜브 플레이어 변수
        let ytPlayer = null;

        // IFrame API 준비
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '0',
                width: '0',
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const cdPlayer = document.getElementById("cdPlayer");
            // 재생 중일 때만 CD 회전
            if (event.data === YT.PlayerState.PLAYING) {
                cdPlayer.classList.add("spinning");
            } else {
                cdPlayer.classList.remove("spinning");
            }
        }

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}:${formattedMS}`;
        }

        function toggleTrickMode() {
            isTrickMode = !isTrickMode;
        }

        function startStop() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(function() {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById("display").innerHTML = timeToString(elapsedTime);
                }, 10);
                
                document.getElementById("startStopBtn").innerText = "정지";
                document.getElementById("startStopBtn").classList.add("running");
                isRunning = true;
            } else {
                clearInterval(timerInterval);
                
                if (isTrickMode) {
                    let seconds = Math.floor(elapsedTime / 1000);
                    let milliseconds = elapsedTime % 1000;

                    if (milliseconds >= 800) { 
                        elapsedTime = (seconds + 1) * 1000;
                        document.getElementById("display").innerHTML = timeToString(elapsedTime);
                    }
                }

                document.getElementById("startStopBtn").innerText = "시작";
                document.getElementById("startStopBtn").classList.remove("running");
                isRunning = false;
            }
        }

        function reset() {
            if (!isRunning) {
                startTime = 0;
                elapsedTime = 0;
                document.getElementById("display").innerHTML = "00:00:00";
            }
        }

        // 음악 섹션 토글
        function toggleMusicSection() {
            const musicSection = document.getElementById("musicSection");
            musicSection.classList.toggle("active");
        }

        // 유튜브 링크에서 비디오 ID 추출
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 유튜브 음원 재생 함수
        function loadAndPlayYouTube() {
            const urlInput = document.getElementById("ytUrlInput").value;
            const videoId = extractVideoId(urlInput);

            if (!videoId) {
                alert("올바른 유튜브 링크를 입력해 주세요.");
                return;
            }

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
            }
        }
    </script>

</body>
</html>
