<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스톱워치</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }

        .stopwatch-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .display {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            font-family: 'Courier New', Courier, monospace;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            user-select: none; /* 꾹 누를 때 드래그 방지 */
            -webkit-user-select: none;
        }

        #startStopBtn {
            background-color: #28a745;
        }

        #startStopBtn.running {
            background-color: #dc3545;
        }

        #resetBtn {
            background-color: #6c757d;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="stopwatch-container">
        <div class="display" id="display">00:00:00</div>
        <div class="buttons">
            <button id="startStopBtn" onclick="startStop()">시작</button>
            <button id="resetBtn" 
                onmousedown="startResetTimer()" 
                onmouseup="cancelResetTimer()" 
                onmouseleave="cancelResetTimer()"
                ontouchstart="startResetTimer()" 
                ontouchend="cancelResetTimer()"
                onclick="handleResetClick()">리셋</button>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        
        // 트릭 모드 관련 변수
        let isTrickMode = false;
        let resetTimer = null;
        let longPressTriggered = false;

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}:${formattedMS}`;
        }

        function startStop() {
            if (!isRunning) {
                // 시작
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(function() {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById("display").innerHTML = timeToString(elapsedTime);
                }, 10);
                
                document.getElementById("startStopBtn").innerText = "정지";
                document.getElementById("startStopBtn").classList.add("running");
                isRunning = true;
            } else {
                // 정지
                clearInterval(timerInterval);
                
                // ★ 트릭 모드가 켜져 있다면, 정지하는 순간 밀리초를 .00으로 즉시 보정
                if (isTrickMode) {
                    elapsedTime = Math.floor(elapsedTime / 1000) * 1000;
                    document.getElementById("display").innerHTML = timeToString(elapsedTime);
                }

                document.getElementById("startStopBtn").innerText = "시작";
                document.getElementById("startStopBtn").classList.remove("running");
                isRunning = false;
            }
        }

        // 3초 꾹 누르기 감지 시작
        function startResetTimer() {
            longPressTriggered = false;
            resetTimer = setTimeout(function() {
                // 3초 도달 시 트릭 모드 토글 (화면에 아무 표시 안 남)
                isTrickMode = !isTrickMode;
                longPressTriggered = true; 
            }, 3000); // 3초 (3000ms)
        }

        // 손을 뗌/영역 벗어남 처리
        function cancelResetTimer() {
            if (resetTimer) {
                clearTimeout(resetTimer);
                resetTimer = null;
            }
        }

        // 일반 클릭 처리 (3초 롱프레스가 아닐 때만 일반 리셋 작동)
        function handleResetClick() {
            if (longPressTriggered) return; // 3초 누른 후 뗐을 때는 리셋 안 되게 차단

            if (!isRunning) {
                startTime = 0;
                elapsedTime = 0;
                document.getElementById("display").innerHTML = "00:00:00";
            }
        }
    </script>

</body>
</html>
