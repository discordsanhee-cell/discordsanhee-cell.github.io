<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스톱워치 & 3D 플레이어</title>
    <!-- Three.js 3D 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px 0;
        }

        .dev-btn {
            background-color: #ff4d4f;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .dev-btn:hover { opacity: 0.85; }

        .stopwatch-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        .display {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            font-family: 'Courier New', Courier, monospace;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }

        #startStopBtn { background-color: #28a745; }
        #startStopBtn.running { background-color: #dc3545; }
        #resetBtn { background-color: #6c757d; }
        .music-toggle-btn { background-color: #17a2b8; font-size: 14px; padding: 8px 16px; width: 100%; }
        button:hover { opacity: 0.9; }

        /* 음악 플레이어 영역 */
        .music-section {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            flex-direction: column;
            align-items: center;
        }

        .music-section.active {
            display: flex;
        }

        /* 3D 캔버스 영역 */
        #cdCanvas {
            width: 280px;
            height: 180px;
            background: #0a0a0a; /* CD가 잘 보이게 배경을 더 어둡게 */
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .input-group {
            display: flex;
            gap: 5px;
            width: 100%;
            margin-bottom: 10px;
        }

        .url-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .url-input:focus { border-color: #17a2b8; }

        .controls-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .control-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            background-color: #333;
        }

        #youtube-player-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="stopwatch-container">
        <!-- 개발자 비밀 버튼 -->
        <button class="dev-btn" onclick="toggleTrickMode()">!누를 시 페이지 재설정! 개발자 전용 버튼!</button>

        <div class="display" id="display">00:00:00</div>
        <div class="buttons">
            <button id="startStopBtn" onclick="startStop()">시작</button>
            <button id="resetBtn" onclick="reset()">리셋</button>
        </div>

        <!-- 음악 토글 버튼 -->
        <button class="music-toggle-btn" onclick="toggleMusicSection()">(음악)</button>

        <!-- 3D 음악 재생 섹션 -->
        <div class="music-section" id="musicSection">
            <!-- Three.js 3D CD 캔버스 -->
            <div id="cdCanvas"></div>

            <div class="input-group">
                <input type="text" id="ytUrlInput" class="url-input" placeholder="유튜브 음악 링크 입력...">
                <button class="control-btn" onclick="insertCDAndPlay()">CD 꽂기</button>
            </div>

            <div class="controls-group">
                <button class="control-btn" style="background-color: #28a745;" onclick="playMusic()">▶ 재생</button>
                <button class="control-btn" style="background-color: #dc3545;" onclick="pauseMusic()">❚❚ 정지</button>
                <button class="control-btn" style="background-color: #6c757d;" onclick="ejectCD()">⏏ 꺼내기</button>
            </div>
        </div>
    </div>

    <div id="youtube-player-container">
        <div id="player"></div>
    </div>

    <script>
        // --- 스톱워치 로직 (기존과 동일) ---
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let isTrickMode = false;

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);
            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);
            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);
            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);
            return `${mm.toString().padStart(2, "0")}:${ss.toString().padStart(2, "0")}:${ms.toString().padStart(2, "0")}`;
        }

        function toggleTrickMode() { isTrickMode = !isTrickMode; }

        function startStop() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(function() {
                    elapsedTime = Date.now() - startTime;
                    document.getElementById("display").innerHTML = timeToString(elapsedTime);
                }, 10);
                document.getElementById("startStopBtn").innerText = "정지";
                document.getElementById("startStopBtn").classList.add("running");
                isRunning = true;
            } else {
                clearInterval(timerInterval);
                if (isTrickMode) {
                    let seconds = Math.floor(elapsedTime / 1000);
                    let milliseconds = elapsedTime % 1000;
                    if (milliseconds >= 800) { 
                        elapsedTime = (seconds + 1) * 1000;
                        document.getElementById("display").innerHTML = timeToString(elapsedTime);
                    }
                }
                document.getElementById("startStopBtn").innerText = "시작";
                document.getElementById("startStopBtn").classList.remove("running");
                isRunning = false;
            }
        }

        function reset() {
            if (!isRunning) {
                startTime = 0;
                elapsedTime = 0;
                document.getElementById("display").innerHTML = "00:00:00";
            }
        }

        function toggleMusicSection() {
            const musicSection = document.getElementById("musicSection");
            musicSection.classList.toggle("active");
            if (musicSection.classList.contains("active") && !threeInitialized) {
                init3DCDPlayer();
            }
        }

        // --- 유튜브 플레이어 API ---
        let ytPlayer = null;
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '0', width: '0',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING && isInserted) {
                isSpinning = true;
            } else {
                isSpinning = false;
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // --- 사실적인 Three.js 3D CD 플레이어 로직 ---
        let scene, camera, renderer, cdMesh, slotMesh;
        let threeInitialized = false;
        let isSpinning = false;
        let isInserted = false;
        let targetCdY = 1.8; 

        function init3DCDPlayer() {
            threeInitialized = true;
            const container = document.getElementById('cdCanvas');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // 1. 다중 조명 세팅 (은색 메탈 표면에 무지개빛 반사를 만들기 위함)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(2, 5, 3);
            scene.add(mainLight);

            const cyanLight = new THREE.PointLight(0x00ffff, 0.5, 10);
            cyanLight.position.set(-2, 2, 2);
            scene.add(cyanLight);

            const magentaLight = new THREE.PointLight(0xff00ff, 0.5, 10);
            magentaLight.position.set(2, -2, 2);
            scene.add(magentaLight);

            // 2. 사실적인 CD 만들기 (그룹화)
            cdMesh = new THREE.Group();

            // 2-1. CD 바깥쪽 데이터 기록면 (반짝이는 은색)
            const discGeo = new THREE.RingGeometry(0.35, 1.2, 64);
            const discMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 1.0,  // 완전한 금속 질감
                roughness: 0.15, // 매끄러운 표면
                side: THREE.DoubleSide
            });
            const discMesh = new THREE.Mesh(discGeo, discMat);
            cdMesh.add(discMesh);

            // 2-2. CD 안쪽 투명 플라스틱 링
            const ringGeo = new THREE.RingGeometry(0.15, 0.35, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 0.3,
                roughness: 0.2,
                transparent: true,
                opacity: 0.4, // 투명하게 설정
                side: THREE.DoubleSide
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            cdMesh.add(ringMesh);

            // (가장 안쪽 0 ~ 0.15 구간은 지오메트리를 생성하지 않아 완전히 뚫린 빈 공간이 됨)

            // CD 눕히기 (RingGeometry는 기본적으로 세워져 생성되므로 X축으로 회전)
            cdMesh.rotation.x = -Math.PI / 3;
            cdMesh.position.y = 1.8;
            scene.add(cdMesh);

            // 3. 3D 플레이어 입구 (슬롯)
            slotMesh = new THREE.Group();
            
            // 플레이어 본체
            const bodyGeo = new THREE.BoxGeometry(3.0, 0.5, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.5 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            slotMesh.add(bodyMesh);

            // CD가 들어가는 틈새(검은색)
            const holeGeo = new THREE.BoxGeometry(2.6, 0.05, 0.81);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const slotHole = new THREE.Mesh(holeGeo, holeMat);
            slotMesh.add(slotHole);

            slotMesh.position.set(0, -0.6, 0);
            scene.add(slotMesh);

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            // CD 상하 이동 (스르륵 들어가는 애니메이션)
            cdMesh.position.y += (targetCdY - cdMesh.position.y) * 0.1;

            // 삽입 상태에서 재생 중일 때만 CD 3D 회전
            if (isSpinning && isInserted) {
                // RingGeometry 기반이므로 Z축을 돌려야 턴테이블처럼 돕니다
                cdMesh.rotation.z -= 0.08; 
            }

            renderer.render(scene, camera);
        }

        // CD 꽂기 동작
        function insertCDAndPlay() {
            const urlInput = document.getElementById("ytUrlInput").value;
            const videoId = extractVideoId(urlInput);

            if (!videoId) {
                alert("올바른 유튜브 링크를 입력해 주세요.");
                return;
            }

            targetCdY = -0.55; // 슬롯 안으로 쏙 들어감
            isInserted = true;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
            }
        }

        // ▶ 재생 동작
        function playMusic() {
            if (!isInserted) {
                alert("먼저 CD를 꽂아주세요!");
                return;
            }
            if (ytPlayer && ytPlayer.playVideo) {
                ytPlayer.playVideo();
            }
        }

        // ❚❚ 정지 동작
        function pauseMusic() {
            if (ytPlayer && ytPlayer.pauseVideo) {
                ytPlayer.pauseVideo();
            }
        }

        // ⏏ 꺼내기 기능
        function ejectCD() {
            isSpinning = false;
            isInserted = false;
            
            if (ytPlayer && ytPlayer.stopVideo) {
                ytPlayer.stopVideo(); 
            }

            targetCdY = 1.8; // CD 배출
        }
    </script>

</body>
</html>
